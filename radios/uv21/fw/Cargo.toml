[workspace]
members = []

[package]
name = "bf5rh-fw"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bf5rh-fw"
test = false
bench = false

[features]
default = []

[dependencies]
cortex-m = "0.7"
radio-common = { path = "../../common-rs" }
cortex-m-rt = { version = "0.7", features = ["device"] }
panic-halt = "0.2"
at32f421-pac = { git = "https://github.com/sophiel-meow/bf-5rh-firmware-open", rev = "e52b2360af7b3152df72f1255682503a0555bb98", features = ["rt"] }
embedded-graphics = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = true
panic = "abort"

[profile.dev]
opt-level = "z"
panic = "abort"
lto = true
codegen-units = 1
overflow-checks = false
