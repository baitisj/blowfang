# Files that must never be committed here: K6 bootloader dumps, Yaesu firmware, module signing
# keys and built images (CI keeps those as artifacts). Add a pattern as one line.
name: Forbidden files
on:
  push:
    branches: [main]
    # a release: pushing any tag runs everything (GitHub skips paths: for tag pushes, and
    # tools/ci_scope.py builds every radio on a push)
    tags: ['**']
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no binaries, bootloaders, Yaesu images or keys
        run: |
          bad=$(git ls-files | grep -iE \
            -e '\.bin$' \
            -e '\.elf$' \
            -e '\.hex$' \
            -e '\.key$' \
            -e '\.a$' \
            -e 'boot\.bin' \
            -e 'k6-boot' \
            -e 'yaesu' \
            -e 'ftm-?300' \
            || true)
          if [ -n "$bad" ]; then
            echo "These files must not be in the repository:"
            echo "$bad"
            exit 1
          fi
          echo "clean"

  # .github/ci-radios.txt, the map of which radios a change builds: every file placed, no stale
  # line, and each radio's test imports and C includes in its section (tools/ci_scope.py --check)
  ci-radios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: the map is complete
        run: python3 tools/ci_scope.py --check
      - name: the scope tool's tests
        run: python -m pytest -q tests/test_ci_scope.py
