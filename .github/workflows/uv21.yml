# Baofeng UV-21 Pro (radios/uv21, MIT): the one-page dumper and the bring-up image, built with
# clang and run in an emulated AT32F421 (Unicorn). The dumper must read the radio back byte for
# byte and never touch a flash register, the SPI flash's write commands or the RF chip's pins; the
# bring-up image must send the RF chip reads only, the SPI flash JEDEC ID only, and drive only the
# board's pins. And tools/uv21_kdh.py, the bootloader tool they go through, against a model of the
# bootloader's command loop. And the firmware port in radios/uv21/fw (Rust, GPL-3, from
# bf-5rh-firmware-open): it must boot on the internal clock, drive only the UV-21's pins, never
# give the RF chip a transmit setting, never erase the SPI flash, and reset on the bootloader's
# command-42 frame so it can be reflashed hands-free.
name: UV-21 Pro

on:
  push:
    branches: [main]
    # a release: pushing any tag runs everything (GitHub skips paths: for tag pushes, and
    # tools/ci_scope.py builds every radio on a push)
    tags: ['**']
    # docs only ([ignore] in .github/ci-radios.txt): no run at all. tools/ci_scope.py --paths
    # prints this list and --check keeps it equal to the map
    paths:
      - '**'
      - '!**/*.md'
      - '!*.md'
      - '!LICENSE'
      - '!.gitignore'
      - '!docs/**'
      - '!.github/workflows/guard.yml'
      - '!.github/workflows/k6-compilers.yml'
      - '!tools/hamlet_prune_worktrees.sh'
      - 'docs/manual/cards/**'
      - 'docs/k6-insights/**'
      - 'docs/k6-modules.md'
  pull_request:
    # docs only ([ignore] in .github/ci-radios.txt): no run at all. tools/ci_scope.py --paths
    # prints this list and --check keeps it equal to the map
    paths:
      - '**'
      - '!**/*.md'
      - '!*.md'
      - '!LICENSE'
      - '!.gitignore'
      - '!docs/**'
      - '!.github/workflows/guard.yml'
      - '!.github/workflows/k6-compilers.yml'
      - '!tools/hamlet_prune_worktrees.sh'
      - 'docs/manual/cards/**'
      - 'docs/k6-insights/**'
      - 'docs/k6-modules.md'
  # weekly, so a radio nobody touched still builds against today's toolchains
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  # Whether this change touches the UV-21 at all (.github/ci-radios.txt, tools/ci_scope.py): a pull
  # request that doesn't skips the job below, and a skipped job counts as passed.
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci_scope.py --github uv21

  uv21:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: clang and lld
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang \
            lld \
            llvm
      - run: |
          pip install \
            pytest \
            unicorn
      - name: the dumper (1 KB at most) and the bring-up image (the 60 KB app area at most)
        run: make -C radios/uv21
      - name: Rust for the port (fw/rust-toolchain.toml names stable and thumbv7em-none-eabi)
        run: rustup toolchain install stable --profile minimal --target thumbv7em-none-eabi
      - name: the firmware port (the 60 KB app area at most)
        run: make -C radios/uv21 port
      - uses: actions/upload-artifact@v4
        with:
          name: uv21-port
          path: |
            radios/uv21/build/port.bin
            radios/uv21/build/port.elf
      - uses: actions/upload-artifact@v4
        with:
          name: uv21-dumper
          path: |
            radios/uv21/build/dumper.bin
            radios/uv21/build/dumper.elf
      - uses: actions/upload-artifact@v4
        with:
          name: uv21-bringup
          path: |
            radios/uv21/build/bringup.bin
            radios/uv21/build/bringup.elf
      - name: tests
        run: |
          python -m pytest -q \
            tests/test_uv21_bringup.py \
            tests/test_uv21_dumper.py \
            tests/test_uv21_kdh.py \
            tests/test_uv21_port.py
