# UV-380 firmware on OpenRTX: OpenRTX (pinned) with blowfang's patch (firmware/uv380-openrtx),
# built for the radio in OpenRTX's own devcontainer image (its arm-miosix-eabi toolchain and
# radio_tool) and for OpenRTX's Linux emulator on a plain runner, where
# tests/test_uv380_openrtx_emu.py runs the PAGER mode and decodes it on the K6 model, and checks
# its speaker preview against sotto's own decoder. Both builds take the sotto 1200 decoder from
# the sotto submodule. The radio image is kept as an artifact, never committed.
name: UV-380 OpenRTX firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  radio:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/openrtx/openrtx-devcontainer:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: build (mduv3x0)
        run: |
          git config --global --add safe.directory '*'
          sh firmware/uv380-openrtx/build.sh mduv3x0
      # the I2S probe image (firmware/uv380-openrtx/i2sprobe.h): out/*_i2sprobe*
      - name: build (mduv3x0, I2S probe)
        run: BLOWFANG_I2SPROBE=1 sh firmware/uv380-openrtx/build.sh mduv3x0
      # the range image (docs/k6-range.md): PTT sends PHY R; out/*_range*
      - name: build (mduv3x0, range)
        run: BLOWFANG_RANGE=1 sh firmware/uv380-openrtx/build.sh mduv3x0
      # the MD-UV380/390 PLUS (10 W, Jeff's radio): OpenRTX's mduv3x0-plus target, which swaps
      # the backlight and PA band select pins; out/openrtx_mduv3x0p*
      - name: build (mduv3x0p)
        run: sh firmware/uv380-openrtx/build.sh mduv3x0p
      - name: build (mduv3x0p, I2S probe)
        run: BLOWFANG_I2SPROBE=1 sh firmware/uv380-openrtx/build.sh mduv3x0p
      - name: build (mduv3x0p, range)
        run: BLOWFANG_RANGE=1 sh firmware/uv380-openrtx/build.sh mduv3x0p
      # both: RAM modules (level 2: the sotto 1200 encoder, the recorded message) and PHY R on
      # PTT; out/*_i2sprobe_range*
      - name: build (mduv3x0p, I2S probe and range)
        run: BLOWFANG_I2SPROBE=1 BLOWFANG_RANGE=1 sh firmware/uv380-openrtx/build.sh mduv3x0p
      - uses: actions/upload-artifact@v4
        with:
          name: uv380-openrtx-image
          path: firmware/uv380-openrtx/out/

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: dependencies (as OpenRTX's own CI)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git \
            pkg-config \
            build-essential \
            meson \
            libsdl2-dev \
            libreadline-dev \
            cmake \
            libusb-1.0-0 \
            libusb-1.0-0-dev \
            libcodec2-dev \
            codec2
      - name: build (linux emulator)
        run: sh firmware/uv380-openrtx/build.sh linux
      - name: build (linux emulator, range)
        run: BLOWFANG_RANGE=1 sh firmware/uv380-openrtx/build.sh linux
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python test dependencies
        run: |
          pip install \
            numpy \
            scipy \
            soundfile \
            pytest
      - name: PAGER mode in the emulator (K6 model decode, speaker preview)
        run: python -m pytest -v tests/test_uv380_openrtx_emu.py
