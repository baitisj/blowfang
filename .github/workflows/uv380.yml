# UV-380 (TYT MD-UV380 / MD-UV390 / Retevis RT3S): the portable pager transmitter's host tests,
# the radio image (kept as an artifact, never committed), and the QEMU build run on an emulated
# STM32F405, whose FFSK must decode with the K6 receiver model, and which encodes speech with the
# fixed-point sotto 1200 from the sotto submodule (the same bits as the x86 build). Ubuntu's own
# Arm toolchain and QEMU, nothing downloaded.
name: UV-380 firmware

on:
  push:
    branches: [main]
  pull_request:
  # weekly, so a radio nobody touched still builds against today's toolchains
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  # Whether this change touches the UV-380 at all (.github/ci-radios.txt, tools/ci_scope.py): a pull
  # request that doesn't skips the jobs below, and a skipped job counts as passed. Everything runs
  # on main, weekly, from "Run workflow", and on a PR labelled ci-full.
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci_scope.py --github uv380

  uv380:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Arm toolchain, QEMU, and clang/lld for the RAM modules
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            qemu-system-arm \
            clang \
            lld \
            llvm
      - run: |
          pip install \
            numpy \
            scipy \
            soundfile \
            espeakng-loader \
            pytest
      - name: host build of the portable transmitter
        run: make -C c/common
      - name: x86 build of the fixed-point sotto, to check the radio's encoder against
        run: make -C sotto/c fixed PYTHON=false
      - name: radio image and QEMU build
        run: |
          make -C radios/uv380
          make -C radios/uv380 qemu
          make -C radios/uv380 omqemu
      - name: tests (host and emulated)
        run: |
          python -m pytest -q \
            tests/test_uv380_pager.py \
            tests/test_uv380_cw.py \
            tests/test_uv380_emu.py \
            tests/test_uv380_codec.py \
            tests/test_uv380_i2sprobe.py \
            tests/test_uv380_mod.py \
            tests/test_uv380_ortx_mod.py \
            tests/test_uv380_micprobe.py \
            tests/test_uv380_sotto8k.py \
            tests/test_range_rx.py \
            tests/test_uv380_sweep.py \
            tests/test_uv380_say.py \
            tests/test_uv380_dfu.py \
            tests/test_uv380_m17.py \
            tests/test_uv380_framers.py
      - uses: actions/upload-artifact@v4
        with:
          name: uv380-image
          path: |
            radios/uv380/build/uv380.bin
            radios/uv380/build/uv380.elf
            radios/uv380/build/uv380.map
