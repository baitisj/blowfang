# RT-950 Pro (radios/rt950, GPL-3): two-chip SURF run on a PC against two modelled BK4829s, its
# build for the AT32F403A, and the glue compiled against the pinned base firmware
# (jaymart1983/Radtel-RT950-Pro-Firmware, GPL-3), so the calls into its drivers stay true. Also
# the K6 SURF tests, since both radios share c/common/surf_core.inc, and the portable polar-TX
# host tests the RT-950's transmit plan rests on. And the backup: the dump-only image built from
# the pinned base firmware with backup/backup-only.patch, checked so it can't write or transmit,
# and rt950_backup.py run against a fake radio.
name: RT-950 firmware

on:
  push:
    branches: [main]
    # docs only ([ignore] in .github/ci-radios.txt): no run at all. tools/ci_scope.py --paths
    # prints this list and --check keeps it equal to the map
    paths:
      - '**'
      - '!**/*.md'
      - '!*.md'
      - '!LICENSE'
      - '!.gitignore'
      - '!docs/**'
      - '!.github/workflows/guard.yml'
      - '!.github/workflows/k6-compilers.yml'
      - '!tools/hamlet_prune_worktrees.sh'
      - 'docs/manual/cards/**'
      - 'docs/k6-insights/**'
      - 'docs/k6-modules.md'
  pull_request:
    # docs only ([ignore] in .github/ci-radios.txt): no run at all. tools/ci_scope.py --paths
    # prints this list and --check keeps it equal to the map
    paths:
      - '**'
      - '!**/*.md'
      - '!*.md'
      - '!LICENSE'
      - '!.gitignore'
      - '!docs/**'
      - '!.github/workflows/guard.yml'
      - '!.github/workflows/k6-compilers.yml'
      - '!tools/hamlet_prune_worktrees.sh'
      - 'docs/manual/cards/**'
      - 'docs/k6-insights/**'
      - 'docs/k6-modules.md'
  # weekly, so a radio nobody touched still builds against today's toolchains
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

env:
  JM_REPO: https://github.com/jaymart1983/Radtel-RT950-Pro-Firmware
  JM_COMMIT: 965eae20614dcbc3d806b613ac1821c90845408d

jobs:
  # Whether this change touches the RT-950 at all (.github/ci-radios.txt, tools/ci_scope.py): a pull
  # request that doesn't skips the jobs below, and a skipped job counts as passed. Everything runs
  # on main, weekly, from "Run workflow", and on a PR labelled ci-full.
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/ci_scope.py --github rt950

  rt950:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: clang, lld and the Arm toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang \
            lld \
            llvm \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi
      - run: |
          pip install \
            numpy \
            scipy \
            pytest \
            unicorn \
            capstone \
            pyserial
      - name: host build (the sim) and the AT32F403A build
        run: |
          make -C radios/rt950
          make -C radios/rt950 target
          make -B -C radios/rt950 target-libm CROSS=arm-none-eabi-gcc
      - name: the glue against the pinned base firmware
        run: |
          git init -q jm
          git -C jm fetch -q --depth 1 "$JM_REPO" "$JM_COMMIT"
          git -C jm checkout -q FETCH_HEAD
          make -C radios/rt950 glue JM="$PWD/jm" CROSS=arm-none-eabi-gcc
      - name: the dump-only image for the backup (built, then checked it can't write or transmit)
        run: make -C radios/rt950 backup-image JM="$PWD/jm"
      - uses: actions/upload-artifact@v4
        with:
          name: rt950-backup-only
          path: |
            radios/rt950/build/rt950-backup-only.BTF
            radios/rt950/build/rt950-backup-only.elf
            radios/rt950/build/rt950-backup-only.verify.txt
      - name: portable host builds
        run: make -C c/common
      - name: tests
        run: |
          python -m pytest -q \
            tests/test_rt950_surf.py \
            tests/test_rt950_digi.py \
            tests/test_rt950_backup.py \
            tests/test_ssb_polar.py \
            tests/test_tone_fsk.py \
            tests/test_k6_surf.py
